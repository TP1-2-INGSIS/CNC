name: CD

# CD se ejecuta al integrar cambios en main (merge / push a main).
# Construye el distribuible del módulo :app y lo publica como artefacto
# y como GitHub Release cuando se crea un tag de versión (vX.Y.Z).
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # necesario para crear releases

jobs:
  package:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # Genera el .zip/.tar distribuible del módulo app (application plugin).
      - name: Build distribution
        run: ./gradlew :app:distZip :app:distTar --no-daemon --stacktrace

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnc-distribution
          path: app/build/distributions/*
          if-no-files-found: error

      # Solo publica un Release cuando el push es de un tag vX.Y.Z.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/distributions/*
          generate_release_notes: true
