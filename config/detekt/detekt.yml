# Detekt configuration for CNC project
# buildUponDefaultConfig is enabled in build.gradle.kts, so this file only overrides defaults.

build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 25
    ignoreSimpleWhenEntries: true
    ignoreNestingFunctions: false
  LongMethod:
    active: true
    threshold: 150
  NestedBlockDepth:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    thresholdInFiles: 60
    thresholdInClasses: 60
    thresholdInInterfaces: 60
    thresholdInObjects: 60
    thresholdInEnums: 60
    ignorePrivate: true

style:
  ReturnCount:
    active: false # Guard clauses y early return forman parte de la filosofía del proyecto
  LoopWithTooManyJumpStatements:
    active: false
  UnusedPrivateProperty:
    active: true
    allowedNames: '(_.*|ignored.*)'
    excludes:
      - '**/test/**'
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreNamedArgument: true
    ignoreAnnotation: true
    excludes:
      - '**/test/**'
      - '**/*Test.kt'
      - '**/*Spec.kt'
      - '**/cli/**'
  WildcardImport:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
    excludeRawStrings: true
  ForbiddenComment:
    active: true
    comments:
      - 'TODO:'
      - 'FIXME:'
      - 'STOPSHIP:'
  UnusedPrivateMember:
    active: true

naming:
  FunctionNaming:
    active: true
    functionPattern: '^([a-z][a-zA-Z0-9]*)|(`.*`)$'
    excludes:
      - '**/test/**'
      - '**/*Test.kt'
      - '**/*Spec.kt'
  MatchingDeclarationName:
    active: false # Permitido en Kotlin para archivos con múltiples nodos o extensiones
  InvalidPackageDeclaration:
    active: false
  PackageNaming:
    active: true
    packagePattern: '^[a-z]+(\.[a-z][A-Za-z0-9_]*)*$' # Permitir versiones como v1_0 y v1_1

exceptions:
  TooGenericExceptionThrown:
    active: true
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '^(ignored|expected|e|ex).*$'
    excludes:
      - '**/cli/**'
