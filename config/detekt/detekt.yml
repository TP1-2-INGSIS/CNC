# Detekt configuration for CNC project
# buildUponDefaultConfig is enabled in build.gradle.kts, so this file only overrides defaults.

build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 20
    ignoreSimpleWhenEntries: true
    ignoreNestingFunctions: false
  LongMethod:
    active: true
    threshold: 60
  NestedBlockDepth:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    thresholdInObjects: 25
    thresholdInEnums: 25
    ignorePrivate: true

style:
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreNamedArgument: true
    ignoreAnnotation: true
    excludes:
      - '**/test/**'
      - '**/*Test.kt'
      - '**/*Spec.kt'
  WildcardImport:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
    excludeRawStrings: true
  ForbiddenComment:
    active: true
    comments:
      - 'TODO:'
      - 'FIXME:'
      - 'STOPSHIP:'
  UnusedPrivateMember:
    active: true

naming:
  FunctionNaming:
    active: true
    functionPattern: '^([a-z][a-zA-Z0-9]*)|(`.*`)$'
    excludes:
      - '**/test/**'
      - '**/*Test.kt'
      - '**/*Spec.kt'
  MatchingDeclarationName:
    active: true
  PackageNaming:
    active: true

exceptions:
  TooGenericExceptionThrown:
    active: true
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '^(ignored|expected).*$'

formatting:
  active: true
  android: false
  autoCorrect: true
  Indentation:
    active: true
    indentSize: 4
  NoTrailingSpaces:
    active: true
  FinalNewline:
    active: true
  MaximumLineLength:
    active: false # Handled by style > MaxLineLength
